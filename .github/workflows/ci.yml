name: Citezy checks
on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: citezy-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          NEBIUS_API_KEY: ''
          TAVILY_API_KEY: ''
          NEMOTRON_MODEL_ID: ''
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_DATA_MODE: real
          # Build-only configuration; not a deployed service or a claim of live readiness.
          NEXT_PUBLIC_API_BASE_URL: https://api.citezy.test
